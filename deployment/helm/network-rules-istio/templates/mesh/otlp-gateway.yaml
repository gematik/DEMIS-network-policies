{{- if and (eq .Values.mesh.enabled true) (eq .Values.mesh.otlpGateway.enabled true) (gt (len .Values.mesh.otlpGateway.hosts) 0) -}}
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ .Values.mesh.otlpGateway.name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    istio: ingressgateway # use istio default controller
  servers:
    - hosts:
      {{- toYaml .Values.mesh.otlpGateway.hosts | nindent 6 }}
      port:
        name: https-otlp
        number: 443
        protocol: HTTPS
      tls:
        credentialName: {{ .Values.mesh.otlpGateway.credential }}
        mode: SIMPLE
{{- end -}}
