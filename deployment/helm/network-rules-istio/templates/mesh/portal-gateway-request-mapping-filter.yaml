{{- if and (eq .Values.mesh.enabled true) (eq .Values.mesh.envoyFilters.portalGatewayRequestMapping.enabled true) }}
{{/* Sets the HTTP Request Header 'gateway-request' to 'true' if it comes from the Notification Gateway */}}
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: portal-gateway-request-mapping-filter
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      istio: ingressgateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
              subFilter:
                name: "envoy.filters.http.router"
      patch:
        operation: INSERT_FIRST
        value:
          name: envoy.lua
          typed_config:
            "@type": "type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua"
            inlineCode: |
              function envoy_on_request(request_handle)
                local request_path_value = request_handle:headers():get(":path")
                if request_path_value and string.match(request_path_value, "/gateway/") then
                    request_handle:headers():replace("gateway-request", "true")
                else
                    request_handle:headers():replace("gateway-request", "false")
                end
              end
{{ end }}