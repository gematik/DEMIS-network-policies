{{- if and (eq .Values.mesh.enabled true) (eq .Values.mesh.envoyFilters.testBaseInfopage.enabled true) }}
{{/* serves a html infopage if no context path is given.  */}}
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: test-base-infopage
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      istio: ingressgateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
              subFilter:
                name: "envoy.filters.http.router"
      patch:
        operation: INSERT_FIRST
        value:
          name: envoy.lua
          typed_config:
            "@type": "type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua"
            inlineCode: |
              function envoy_on_request(request_handle)
                local text = [[
                  <!DOCTYPE html>
                  <html data-critters-container="" data-lt-installed="true" lang="de">
                    <head>
                      <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
                      <title>Willkommen auf den DEMIS-Testumgebungen</title>
                      <base href=".">
                      <meta content="systemjs-importmap" name="importmap-type">
                      <meta content="width=device-width, initial-scale=1" name="viewport">
                      <style type="text/css">
                        .container{--bs-gutter-x:1.5rem;--bs-gutter-y:0;width:100%;padding-right:calc(var(--bs-gutter-x) * .5);padding-left:calc(var(--bs-gutter-x) * .5);margin-right:auto;margin-left:auto}.row{--bs-gutter-x:1.5rem;--bs-gutter-y:0;display:flex;flex-wrap:wrap;margin-top:calc(-1 * var(--bs-gutter-y));margin-right:calc(-.5 * var(--bs-gutter-x));margin-left:calc(-.5 * var(--bs-gutter-x))}.row>*{box-sizing:border-box;flex-shrink:0;width:100%;max-width:100%;padding-right:calc(var(--bs-gutter-x) * .5);padding-left:calc(var(--bs-gutter-x) * .5);margin-top:var(--bs-gutter-y)}.col{flex:1 0 0%}.app-frame,app-root,body,html{font-family:Verdana,sans-serif;box-sizing:border-box;height:100%;margin:0;letter-spacing:normal;background-color:unset!important}h1,h2,h3,h4,h5,h6{color:var(--color-primary)}h2{padding-top:15px}.app-navbar-demis .mat-mdc-tab-link>span.mdc-tab__content>span.mdc-tab__text-label{color:var(--color-demis-black)}.mat-mdc-table{background-color:var(--color-demis-white)!important}html{--mat-divider-width:1px}html{--mat-divider-color:rgba(0, 0, 0, .12)}:root{--color-primary:#003A66;--color-demis-blue:#0065B0;--color-white:#FFFFFF;--color-black:#000000}:root{--color-demis-gray:rgb(145, 157, 157);--color-demis-white:rgb(255, 255, 255);--color-demis-black:rgb(0, 3, 3);--color-demis-focused-background:rgba(148, 151, 227, .05);--color-demis-stroke:rgba(0, 3, 3, .12);--gem-demis-primary-color:rgb(0, 14, 82);--gem-demis-border-color:rgb(89, 89, 89);--gem-demis-text-color:rgb(89, 89, 89);--gem-demis-line-height-offset:.1rem;--gem-demis-icon-to-text-padding:8px}html{--mat-divider-width:1px}html{--mat-divider-color:rgba(0, 0, 0, .12)}.mat-mdc-button-base{text-decoration:none}.mdc-button{-webkit-user-select:none;user-select:none;position:relative;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-width:64px;border:none;outline:0;line-height:inherit;-webkit-appearance:none;overflow:visible;vertical-align:middle;background:rgba(0,0,0,0);padding:0 8px}.mdc-button::-moz-focus-inner{padding:0;border:0}.mdc-button:active{outline:0}.mdc-button:hover{cursor:pointer}.mdc-button:disabled{cursor:default;pointer-events:none}.mdc-button[hidden]{display:none}.mdc-button .mdc-button__label{position:relative;padding:10px}.mat-mdc-button{padding:0 var(--mat-text-button-horizontal-padding,8px);height:var(--mdc-text-button-container-height);font-family:var(--mdc-text-button-label-text-font,var(--mat-app-label-large-font));font-size:var(--mdc-text-button-label-text-size,var(--mat-app-label-large-size));letter-spacing:var(--mdc-text-button-label-text-tracking,var(--mat-app-label-large-tracking));text-transform:var(--mdc-text-button-label-text-transform);font-weight:var(--mdc-text-button-label-text-weight,var(--mat-app-label-large-weight))}.demis-logo{position:absolute;bottom:0;right:0;overflow:hidden;width:50%;height:auto;background-repeat:no-repeat;background-size:100%;z-index:-1}:root{--color-primary:#003A66;--color-demis-blue:#0065B0;--color-white:#FFFFFF;--color-black:#000000}.mat-toolbar{background-color:var(--color-white)}#home-button{display:inline-flex;cursor:pointer;padding-left:16px;padding-right:16px;height:55px;align-items:center;justify-content:center;font-size:28px;line-height:34px;font-weight:700;color:var(--color-demis-blue)}#home-button #img-demis-logo{color:var(--color-demis-blue);margin-right:8px;margin-top:15px;margin-bottom:15px;height:45px;width:45px}.navbar-to-content-divider{border-color:var(--color-demis-gray);margin-top:-1px;position:relative;z-index:999}.mat-toolbar{color:var(--mat-toolbar-container-text-color,var(--mat-app-on-surface))}.mat-toolbar-row,.mat-toolbar-single-row{display:flex;box-sizing:border-box;padding:0 16px;width:100%;flex-direction:row;align-items:center;white-space:nowrap;height:var(--mat-toolbar-standard-height)}.mat-divider{display:block;margin:0;border-top-style:solid;border-top-width:var(--mat-divider-width)}#new-welcome-container{max-width:60vw;align-items:center;flex-direction:column;display:flex}#welcome-demis-heading{text-align:center;margin-top:3%;font-size:45px;font-weight:700;line-height:54px}.welcome-demis-text{font-size:17px;line-height:22px;max-width:980px}#welcome-tiles-container{display:flex;flex-wrap:wrap;justify-content:center;align-items:center}
                      </style>
                    </head>

                    <body>
                      <div>
                        <div class="mat-typography app-frame mat-app-background d-flex flex-column flex-grow-1">
                          <div class="app-header">
                            <div class="mat-toolbar app-navbar-demis mat-toolbar-single-row">
                              <button class="mdc-button mat-mdc-button mat-unthemed mat-mdc-button-base"
                                id="home-button" routerlink="/" tabindex="0">
                                <span class="mat-mdc-button-persistent-ripple mdc-button__ripple"></span>
                                <img height="50" width="50" src="data:image/png;base64,"/>
                                <span class="mdc-button__label"> DEMIS </span>
                              </button>
                              <span class="toolbar-spacer"></span>
                            </div>
                            <div class="mat-divider navbar-to-content-divider"></div>
                          </div>
                          <div style="position: relative;">
                            <div>
                              <div id="gem-demis-max-height-content-container" style="height: calc(-64px + 100vh);">
                                <div>
                                  <div class="container" id="new-welcome-container">
                                    <div class="row" id="welcome-tiles-container">
                                      <h2 id="welcome-demis-heading">Willkommen auf den DEMIS-Testumgebungen</h2>
                                      <p class="welcome-demis-text">Sie befinden sich auf der
                                        DEMIS-Testumgebung. Weitere Informationen zu den verschiedenen Varianten der
                                        Testumgebung finden Sie in der
                                        <a href="https://wiki.gematik.de/x/AbKTLQ">DEMIS-Wissensdatenbank</a>.
                                      </p>
                                      <p class="welcome-demis-text">Wählen Sie dort unter dem
                                        Abschnitt Service-Endpunkte, den Link für das Meldeportal des entsprechenden
                                        Umgebungstypen aus.</p>
                                    </div>
                                  </div>
                                </div>
                                <img alt="DEMIS-background-logo" class="demis-logo" height="1101" width="1061"
                                  src="data:image/png;base64,"
                                >
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </body>
                  </html>
                ]]
                request_handle:logInfo("DEMIS - serving test base infopage")
                local request_path_value = request_handle:headers():get(":path")
                if request_path_value == "" or request_path_value == "/" then
                  request_handle:logInfo("DEMIS - serving test base infopage")
                  request_handle:respond(
                    {
                      [":status"] = "200",
                      ["content-type"] = "text/html"
                    },
                    text
                  )
                end
              end
{{ end }}