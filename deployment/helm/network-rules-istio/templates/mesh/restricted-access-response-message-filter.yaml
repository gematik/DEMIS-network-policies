{{- if and (eq .Values.mesh.enabled true) (eq .Values.mesh.envoyFilters.restrictedAccessResponseMsg.enabled true) }}
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: restricted-access-response-message-filter
  namespace: istio-system
spec:
  workloadSelector:
    labels:
      istio: ingressgateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: "envoy.filters.network.http_connection_manager"
              subFilter:
                name: "envoy.filters.http.router"
      patch:
        operation: INSERT_FIRST
        value:
          name: envoy.lua
          typed_config:
            "@type": "type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua"
            inlineCode: |
              function envoy_on_response(response_handle)
                local response_code = response_handle:headers():get(":status")
                if response_code == "403" then
                  local response_body = response_handle:body()
                  if response_body ~= nil then
                    local response_body_string = tostring(response_body:getBytes(0, response_body:length()))
                    local rbac_ad = string.match (response_body_string, "RBAC: access denied" )
                    local text = "<!DOCTYPE html>\n" ..
                      "<html lang=\"en\">\n" ..
                      "<head>\n" ..
                      "    <meta charset=\"UTF-8\">\n" ..
                      "    <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n" ..
                      "    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n" ..
                      "    <title>DEMIS-Entwicklungsumgebung</title>\n" ..
                      "    <style>\n" ..
                      "        * {\n" ..
                      "            margin: 0;\n" ..
                      "            padding: 0;\n" ..
                      "            border: 0;\n" ..
                      "        }\n" ..
                      "        body {\n" ..
                      "            padding: 10px;\n" ..
                      "        }\n" ..
                      "        .container {\n" ..
                      "            margin-top: 10rem;\n" ..
                      "            text-align: center;\n" ..
                      "        }\n" ..
                      "        .container .error {\n" ..
                      "            font-size: 4rem;\n" ..
                      "        }\n" ..
                      "        .container .description {\n" ..
                      "            font-size: 1.2rem;\n" ..
                      "        }\n" ..
                      "        @media screen and (max-width: 600px) {\n" ..
                      "            .container .error {\n" ..
                      "                font-size: 5rem;\n" ..
                      "            }\n" ..
                      "        }\n" ..
                      "    </style>\n" ..
                      "</head>\n" ..
                      "<body>\n" ..
                      "    <div class=\"container\">\n" ..
                      "        <div class=\"error\">\n" ..
                      "           DEMIS Entwicklungsumgebung \n" ..
                      "        </div>\n" ..
                      "        <br>\n" ..
                      "        <br>\n" ..
                      "     <img src=\"data:image/png;base64,\">\n" ..


                      "        <br>\n" ..
                      "        <br>\n" ..
                      "        <br>\n" ..
                      "        <div class=\"description\">\n" ..
                      "            Dies ist die DEMIS-Entwicklungsumgebung und nur für den internen Gebrauch freigegeben.<br>\n" ..
                      "            Nähere Informationen zu DEMIS finden Sie auf der\n" ..
                      "            <a href=\"https://wiki.gematik.de/display/DSKB\">Startseite der DEMIS Wissensdatenbank</a>.\n" ..
                      "        </div>\n" ..

                      "    </div>\n" ..
                      "</body>\n" ..
                      "</html>"

                    if ( rbac_ad ~= nil) then
                      response_handle:body():setBytes(text)
                      response_handle:headers():replace("content-type", "text/html")
                    end
                  end
                end
              end
{{- end }}
